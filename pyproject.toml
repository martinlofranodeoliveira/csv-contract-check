[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "csv-contract-check"
version = "0.1.0"
description = "Offline CSV validation against small JSON contracts, using Python's standard library"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Martin Lofrano de Oliveira"}]
keywords = ["csv", "validation", "cli", "offline", "data-quality"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Utilities",
]
dependencies = []

[project.scripts]
csv-contract-check = "csv_contract_check.cli:main"

[tool.setuptools]
packages = ["csv_contract_check"]
